name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto-check:
    name: Protobuf & Schema Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'studio/web/pnpm-lock.yaml'

      - name: Install Web dependencies (for protoc-gen-ts_proto)
        working-directory: studio/web
        run: pnpm install --frozen-lockfile

      - name: Generate Proto Stubs & Verify Schema Sync
        run: |
          make proto
          git diff --exit-code || (echo "Generated protobuf stubs are out of sync. Please commit generated files." && exit 1)

  web-check:
    name: Next.js Web Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'studio/web/pnpm-lock.yaml'

      - name: Install Web dependencies
        working-directory: studio/web
        run: pnpm install --frozen-lockfile

      - name: Lint Studio Web
        working-directory: studio/web
        run: pnpm run lint

  api-check:
    name: FastAPI Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python dependencies
        working-directory: studio/api
        run: uv sync

      - name: Lint Python API
        working-directory: studio/api
        run: uv run ruff check app/

      - name: Run Python API Tests
        working-directory: studio/api
        run: uv run pytest tests/ -v

  rust-check:
    name: Rust Voice Server & Engine Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (protoc & opus)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libopus-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache (Speed up compilation)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            voice/server
            voice/engine
            integrations

      - name: Rust Format Check
        run: |
          cd voice/server && cargo fmt --check || true
          cd ../engine && cargo fmt --check || true
          cd ../../integrations && cargo fmt --check || true

      - name: Clippy Lint
        run: |
          cd voice/server && cargo clippy -- -D warnings
          cd ../engine && cargo clippy -- -D warnings
          cd ../../integrations && cargo clippy -- -D warnings

      - name: Run Rust Tests
        run: |
          cd voice/server && cargo test
          cd ../engine && cargo test
          cd ../../integrations && cargo test
