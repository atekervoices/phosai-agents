# ==============================================================================
# ⚠️ WARNING: FOR LOCAL DEVELOPMENT ONLY ⚠️
# This docker-compose file is optimized for local development experience.
# It contains hardcoded fallback secrets, missing resource limits, and runs
# containers as root.
#
# DO NOT USE THIS FILE FOR PRODUCTION DEPLOYMENTS.
# ==============================================================================
name: feros-voice-agent-os

services:
  # PostgreSQL Database
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voice-agent-os}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-voice_agent}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voice-agent-os} -d $${POSTGRES_DB:-voice_agent}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Python Backend (FastAPI)
  studio-api:
    image: feros-studio-api:local
    build:
      context: .
      dockerfile: studio/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE__URL: ${DATABASE__URL:-postgresql://${POSTGRES_USER:-voice-agent-os}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-voice_agent}}
      AUTH__SECRET_KEY: ${AUTH__SECRET_KEY}
      AUTH__SUPERADMIN_API_KEY: ${AUTH__SUPERADMIN_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      OPENAI_API_KEY: ${LLM_API_KEY:-${OPENAI_API_KEY:-}}
      LLM_API_KEY: ${LLM_API_KEY:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    extra_hosts:
      - "stt-staging.atekervoices.com:104.21.78.126"
      - "tts.atekervoices.com:104.21.78.126"
      - "whisper-stt.atekervoices.com:104.21.78.126"
      - "api.openai.com:172.66.0.243"
      - "api.deepgram.com:4.20.80.211"
    volumes:
      - ./studio/api:/app
      - recordings:/recordings
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    command: >
      sh -c "alembic upgrade head &&
             python update_db.py &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # Rust Voice Server (telephony gateway + WebRTC)
  voice-server:
    image: feros-voice-server:local
    build:
      context: .
      dockerfile: voice/server/Dockerfile
    extra_hosts:
      - "stt-staging.atekervoices.com:104.21.78.126"
      - "tts.atekervoices.com:104.21.78.126"
      - "whisper-stt.atekervoices.com:104.21.78.126"
      - "api.openai.com:172.66.0.243"
      - "api.deepgram.com:4.20.80.211"
    ports:
      - "8300:8300"
      - "50000:50000/udp"
    environment:
      DATABASE__URL: ${DATABASE__URL:-postgresql://${POSTGRES_USER:-voice-agent-os}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-voice_agent}}
      AUTH__SECRET_KEY: ${AUTH__SECRET_KEY}
      SERVER__LISTEN_HOST: 0.0.0.0
      SERVER__LISTEN_PORT: 8300
      WEBRTC__UDP_PORT: 50000
      WEBRTC__PUBLIC_IP: ${WEBRTC__PUBLIC_IP:-}
      TELNYX__PUBLIC_KEY: ${TELNYX__PUBLIC_KEY:-}
      VOICE_SERVER__PUBLIC_URL: ${VOICE_SERVER__PUBLIC_URL:-}
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-*}"
      RUST_LOG: voice_server=debug,voice_engine=info,agent_kit=info,voice_transport=info
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      LLM_API_KEY: ${LLM_API_KEY:-${OPENAI_API_KEY:-}}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-${LLM_API_KEY:-}}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      STT_PROVIDER: ${STT_PROVIDER:-nemotron}
      STT_BASE_URL: ${STT_BASE_URL:-https://stt-staging.atekervoices.com}
      STT_MODEL: ${STT_MODEL:-phosai-streaming-voice-v1}
      STT_API_KEY: ${STT_API_KEY:-}
      NEMOTRON_STT_URL: ${NEMOTRON_STT_URL:-${STT_BASE_URL:-https://stt-staging.atekervoices.com/}}
      CANARY_STT_URL: ${CANARY_STT_URL:-${STT_BASE_URL:-https://stt-staging.atekervoices.com/}}
      TTS_PROVIDER: ${TTS_PROVIDER:-openai}
      TTS_BASE_URL: ${TTS_BASE_URL:-https://api.openai.com/v1}
      TTS_MODEL: ${TTS_MODEL:-tts-1}
      TTS_VOICE_ID: ${TTS_VOICE_ID:-alloy}
      TTS_API_KEY: ${OPENAI_API_KEY:-${LLM_API_KEY:-}}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-ee78b1cb7f384fc82c2d59946d31a6507a992ff0}
      FEROS_VAD_SILENCE_FRAMES: 16
      SMART_TURN_THRESHOLD: "0.85"
      # Write recordings to /recordings (shared with studio-api container via named volume).
      # The Python studio-api serves them at /api/recordings/{filename}.
      RECORDING__OUTPUT_URI: "file:///recordings"
    volumes:
      - recordings:/recordings
    depends_on:
      db:
        condition: service_healthy
      studio-api:
        condition: service_healthy

  # Next.js Frontend
  studio-web:
    image: feros-studio-web:local
    build:
      context: .
      dockerfile: studio/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_VOICE_SERVER_URL: ${NEXT_PUBLIC_VOICE_SERVER_URL:-${VOICE_SERVER__PUBLIC_URL:-}}
      BACKEND_API_URL: http://studio-api:8000
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-${VITE_FIREBASE_API_KEY:-}}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-${VITE_FIREBASE_AUTH_DOMAIN:-}}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-${VITE_FIREBASE_PROJECT_ID:-}}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-${VITE_FIREBASE_STORAGE_BUCKET:-}}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-${VITE_FIREBASE_MESSAGING_SENDER_ID:-}}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-${VITE_FIREBASE_APP_ID:-}}
      NEXT_PUBLIC_FIREBASE_DATABASE_URL: ${NEXT_PUBLIC_FIREBASE_DATABASE_URL:-${VITE_FIREBASE_DATABASE_URL:-}}
      NEXT_PUBLIC_ADMIN_EMAIL: ${ADMIN_EMAIL:-simonallanachuka@gmail.com}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-simonallanachuka@gmail.com}
      AUTH__SUPERADMIN_API_KEY: ${AUTH__SUPERADMIN_API_KEY:-}
      STUDIO_SUPERADMIN_API_KEY: ${STUDIO_SUPERADMIN_API_KEY:-}
      NODE_ENV: ${NODE_ENV:-production}
      WATCHPACK_POLLING: "true"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    volumes:
      - ./studio/web:/app
      - /app/node_modules
      - studio_web_next:/app/.next
      - studio_web_pnpm_store:/root/.local/share/pnpm/store
    depends_on:
      - studio-api
    command: >
      sh -c "pnpm install --config.confirmModulesPurge=false &&
             if [ \"$$NODE_ENV\" = \"development\" ]; then
               pnpm dev -H 0.0.0.0;
             else
               pnpm build && pnpm start -H 0.0.0.0 -p 3000;
             fi"

  # Caddy automated reverse proxy
  caddy:
    image: caddy:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - studio-web
      - studio-api
      - voice-server

volumes:
  pgdata:
  recordings:
  studio_web_next:
  studio_web_pnpm_store:
  caddy_data:
  caddy_config:
